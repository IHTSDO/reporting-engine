securityServiceStubMode=false

server.servlet.context-path=/reporting-service
server.port=8089
# Handles X-Forwarded-XXX headers
# Support additional web proxy headers
# See https://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#howto.webserver.use-behind-a-proxy-server
server.forward-headers-strategy=FRAMEWORK

spring.security.user.name=user
spring.security.user.password=password

# Providing a value here enables SSO security
ims-security.required-role=

# Can be used to configure static SSO values for dev rather than using Nginx
authentication.override.username=
authentication.override.roles=
authentication.override.token=

spring.datasource.url=jdbc:mysql://localhost:3306/reporting_service?useSSL=false
spring.datasource.username=local
spring.datasource.password=

spring.datasource.hikari.max-lifetime=600000
spring.datasource.testWhileIdle=true
spring.datasource.test-on-borrow=true

# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Two harmless WARNs are expected here on startup: this schema's UUID id columns predate the
# current mapping, so Hibernate 7 tries to narrow job_schedule.id and job_schedules.schedules_id
# to binary(16) and InnoDB refuses to retype a column referenced by a foreign key. Hibernate
# logs these via ExceptionHandlerLoggedImpl and carries on, so startup is unaffected. Do not set
# hibernate.hbm2ddl.halt_on_error - that rethrows them and startup then fails.
spring.jpa.hibernate.ddl-auto=update

spring.activemq.broker-url=
spring.activemq.user=
spring.activemq.password=

reporting.service.queue.request=reporting_service_request
reporting.service.queue.response=reporting_service_response
reporting.service.queue.metadata=reporting_service_metadata

reporting.service.terminology.server.uri=

module.storage.readonly = false
module.storage.local.path = store/local/
module.storage.useCloud = false
module.storage.cloud.bucketName =
module.storage.cloud.path =

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# These configure the Jackson 3 mapper that Boot auto-configures, which serves REST
# responses and is injected by JobReceiver. They carry over the settings the hand-rolled
# Jackson 2 ObjectMapper bean applied before the Spring Boot 4 upgrade, so that responses
# keep the same fields, values and key order. Without the inclusion setting every null
# field reappears in every response; without the sort setting Jackson 3 orders keys
# alphabetically rather than by declaration, which is harmless to a JSON parser but breaks
# any byte comparison, ETag or snapshot over a response.
spring.jackson.default-property-inclusion=non_empty
spring.jackson.time-zone=UTC
spring.jackson.mapper.sort-properties-alphabetically=false

spring.cloud.consul.enabled=false
#spring.cloud.consul.config.prefix=consul
#spring.application.name=reporting-service
#spring.cloud.consul.discovery.healthCheckPath=version
#spring.cloud.consul.config.profile-separator=/
#spring.config.import=consul:localhost:8500

spring.cloud.vault.enabled=false
#spring.cloud.vault.token=00000000-0000-0000-0000-000000000000
#spring.cloud.vault.scheme=http
#spring.cloud.vault.kv.enabled=true
#spring.config.import=consul:localhost:8500,vault://
#spring.cloud.vault.uri=http://localhost:8200

# ----------------------------------------
# Springdoc Swagger config
# ----------------------------------------
springdoc.packagesToScan=org.ihtsdo.authoring.scheduler.api.rest
# To completely hide the schemas section
springdoc.swagger-ui.defaultModelsExpandDepth=-1
# Sort by tag
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
# Hide doc expansion
springdoc.swagger-ui.docExpansion=none
# Enable tryout by default
springdoc.swagger-ui.tryItOutEnabled=true
# Disable generic response
springdoc.override-with-generic-response=false
# Expose spring-boot-actuator endpoints
springdoc.show-actuator=true
springdoc.swagger-ui.groups-order=desc